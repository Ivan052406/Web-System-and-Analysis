<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventory Management | Store Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/inventory.css">
</head>
<body data-page="inventory" data-root="../" data-title="Inventory Management">
<div class="app">
  <!-- Sidebar and top bar are built by js/app.js so they stay identical on every page -->
  <aside class="sidebar" id="sidebar" aria-label="Main navigation"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">
      <section class="page">
        <div class="cards">
          <div class="card"><div class="card-label">Total products</div><div class="card-value" id="invTotalProducts">0</div></div>
          <div class="card"><div class="card-label">Total stock</div><div class="card-value" id="invTotalUnits">0</div></div>
          <div class="card warn"><div class="card-label">Low stock</div><div class="card-value" id="invLow">0</div></div>
          <div class="card danger"><div class="card-label">Out of stock</div><div class="card-value" id="invOut">0</div></div>
        </div>

        <div id="stockAlerts"></div>

        <div class="grid-2">
          <div class="panel"><h2>Current stock per product</h2><div class="chart-box"><canvas id="invBarChart"></canvas></div></div>
          <div class="panel"><h2>Stock status</h2><div class="chart-box"><canvas id="invDonutChart"></canvas></div></div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h2>Current stock</h2>
            <div class="btn-group">
              <button class="btn primary" id="btnAddProduct">Add product</button>
              <button class="btn" id="btnSell">Deduct stock</button>
              <button class="btn" id="btnStockIn">Stock-in</button>
              <button class="btn" id="btnAdjust">Adjust stock</button>
            </div>
          </div>
          <div class="toolbar">
            <input type="search" id="invSearch" placeholder="Search by ID, name or category">
            <select id="invCategory"></select>
            <select id="invStatus">
              <option value="">All statuses</option>
              <option value="ok">In stock</option>
              <option value="low">Low stock</option>
              <option value="out">Out of stock</option>
            </select>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr>
                <th>Product ID</th><th>Product name</th><th>Category</th><th class="num">Price</th>
                <th class="num">Current stock</th><th class="num">Minimum</th><th>Status</th><th>Actions</th>
              </tr></thead>
              <tbody id="invTableBody"></tbody>
            </table>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head"><h2>Inventory history</h2><span class="muted" id="histCount"></span></div>
          <div class="toolbar">
            <input type="search" id="histSearch" placeholder="Search product or reason">
            <select id="histType">
              <option value="">All movement types</option>
              <option>Stock-In</option><option>Stock-Out</option><option>Sale</option><option>Adjustment</option>
            </select>
            <label class="inline-field">From <input type="date" id="histFrom"></label>
            <label class="inline-field">To <input type="date" id="histTo"></label>
            <button class="btn ghost small" id="histClear">Clear filters</button>
          </div>
          <div class="table-wrap tall">
            <table>
              <thead><tr>
                <th>Date and time</th><th>Product</th><th>Type</th><th class="num">Quantity</th>
                <th class="num">Previous</th><th class="num">Updated stock</th><th>Reason</th>
              </tr></thead>
              <tbody id="histBody"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/app.js"></script>
<script src="../js/inventory.js"></script>
</body>
</html>
