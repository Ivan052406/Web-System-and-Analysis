<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="icon" href="../assets/images/casia-logo.png">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/availability.css">
    <title>Availability Check | CASIA Canteen</title>
</head>
<body data-page="availability" data-title="Availability Check">

    <div class="app">

        <!-- SIDE NAVIGATION (built by ../js/shell.js) -->
        <aside class="sidebar" id="sidebar"></aside>
        <div class="backdrop" id="backdrop"></div>

        <div class="main">
            <header class="topbar">
                <button class="menu-btn" id="menuBtn" aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>
                <span class="topbar-title" id="topbarTitle"></span>
                <span class="topbar-user" id="topbarUser"></span>
            </header>

            <main class="page">
                <div class="page-head"><h1>Availability Check</h1><p>See what is in stock before you walk over. Stores update this list themselves.</p></div>

                <div id="alerts"></div>
                <div class="status-bar panel" id="statusBar"></div>

                <div class="toolbar">
                    <select class="select" id="store" aria-label="Store"></select>
                    <div class="chips" id="filter">
                        <button class="chip active" data-f="all">All</button>
                        <button class="chip" data-f="in">Available</button>
                        <button class="chip" data-f="out">Out of stock</button>
                    </div>
                    <input class="input search" id="q" type="search" placeholder="Search a product" aria-label="Search a product">
                    <span class="spacer"></span>
                    <label class="check"><input type="checkbox" id="auto" checked> Auto-refresh</label>
                    <button class="btn sm ghost" id="refresh"><i class="fa-solid fa-rotate"></i> Refresh</button>
                </div>

                <div id="table"></div>
            </main>
        </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- Load order matters: data.js, then shell.js, then this page's script -->
    <script src="../js/data.js"></script>
    <script src="../js/shell.js"></script>
    <script src="../js/availability.js"></script>
</body>
</html>
