
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CASIA | Reset Password</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <link rel="stylesheet" href="../css/forgot-password.css">
</head>

<body>

    <header class="page-header">
        <img src="../assets/images/casia-logo.png"
             alt="CASIA Logo">

        <span>CASIA Canteen Management System</span>
    </header>

    <main class="page-content">

        <section class="auth-card">

            <div class="brand-logo">
                <img src="../assets/images/casia-logo.png"
                     alt="CASIA Logo">
            </div>

            <div class="card-heading">
                <h1>Reset Your Password</h1>

                <p>
                    Create a new password for your CASIA account.
                    Make sure you can remember it.
                </p>
            </div>

            <form id="resetPasswordForm">

                <label for="newPassword">New Password</label>

                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="newPassword"
                        name="password"
                        placeholder="Enter new password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <label for="confirmPassword">Confirm New Password</label>

                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirm_password"
                        placeholder="Confirm new password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="form-message"
                     id="resetMessage"
                     role="status"
                     aria-live="polite"></div>

                <button type="submit"
                        class="primary-button"
                        id="resetButton">

                    <i class="fa-solid fa-key"></i>
                    Update Password

                </button>

            </form>

            <a href="/student/pages/login.html" id="resetBackLink" class="back-link">
                <i class="fa-solid fa-arrow-left"></i>
                Back to Sign In
            </a>

        </section>

    </main>

    <footer class="page-footer">
        <p>© 2026 CASIA Canteen Management System</p>
    </footer>

    <script>
        if (new URLSearchParams(window.location.search).get("role") === "admin") {
            document.getElementById("resetBackLink").href = "/student/pages/login.html?role=admin";
        }
    </script>
    <script src="../js/reset-password.js"></script>

</body>
</html>
