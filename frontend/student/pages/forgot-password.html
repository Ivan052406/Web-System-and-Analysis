
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CASIA | Forgot Password</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <link rel="stylesheet" href="../css/forgot-password.css">
</head>

<body>

    <header class="page-header">
        <img src="../assets/images/casia-logo.png"
             alt="CASIA Logo">

        <span>CASIA Canteen Management System</span>
    </header>

    <main class="page-content">

        <section class="auth-card">

            <div class="brand-logo">
                <img src="../assets/images/casia-logo.png"
                     alt="CASIA Logo">
            </div>

            <div class="card-heading">
                <h1>Forgot Password?</h1>

                <p>
                    Don't worry! Enter your registered email address
                    and we'll send you a link to reset your password.
                </p>
            </div>

            <form id="forgotPasswordForm">

                <label for="email">Email Address</label>

                <div class="input-group">
                    <i class="fa-solid fa-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your registered email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-message"
                     id="forgotMessage"
                     role="status"
                     aria-live="polite"></div>

                <button type="submit"
                        class="primary-button"
                        id="sendResetButton">

                    <i class="fa-solid fa-paper-plane"></i>
                    Send Reset Link

                </button>

            </form>

            <a href="/student/pages/login.html" class="back-link">
                <i class="fa-solid fa-arrow-left"></i>
                Back to Sign In
            </a>

        </section>

    </main>

    <footer class="page-footer">
        <p>© 2026 CASIA Canteen Management System</p>
    </footer>

    <script src="../js/forgot-password.js"></script>

</body>
</html>
