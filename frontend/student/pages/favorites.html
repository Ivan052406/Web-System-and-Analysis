<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="icon" href="../assets/images/casia-logo.png">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/favorites.css">
    <title>Favorites | CASIA Canteen</title>
</head>
<body data-page="favorites" data-title="Favorites">

    <div class="app">

        <!-- SIDE NAVIGATION (built by ../js/shell.js) -->
        <aside class="sidebar" id="sidebar"></aside>
        <div class="backdrop" id="backdrop"></div>

        <div class="main">
            <header class="topbar">
                <button class="menu-btn" id="menuBtn" aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>
                <span class="topbar-title" id="topbarTitle"></span>
                <span class="topbar-user" id="topbarUser"></span>
            </header>

            <main class="page">
                <div class="page-head"><h1>Favorites</h1><p>Your saved stores and products, with a note of your own on each.</p></div>

                <div class="toolbar" id="favTools" hidden>
                    <div class="chips" id="tabs">
                        <button class="chip active" data-tab="all">All <span id="cAll">0</span></button>
                        <button class="chip" data-tab="stores">Stores <span id="cStores">0</span></button>
                        <button class="chip" data-tab="products">Products <span id="cProducts">0</span></button>
                    </div>
                    <span class="spacer"></span>
                    <select class="select" id="sort" aria-label="Sort favorites">
                        <option value="recent">Recently saved</option>
                        <option value="name">Name A–Z</option>
                    </select>
                    <button class="btn sm danger" id="clearAll">Clear all</button>
                </div>

                <p class="summary" id="summary" hidden></p>
                <section id="list"></section>
            </main>
        </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- Load order matters: data.js, then shell.js, then this page's script -->
    <script src="../js/data.js"></script>
    <script src="../js/shell.js"></script>
    <script src="../js/favorites.js"></script>
</body>
</html>
