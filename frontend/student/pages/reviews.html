<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="icon" href="../assets/images/casia-logo.png">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/reviews.css">
    <title>Reviews & Feedback | CASIA Canteen</title>
</head>
<body data-page="reviews" data-title="Reviews & Feedback">

    <div class="app">

        <!-- SIDE NAVIGATION (built by ../js/shell.js) -->
        <aside class="sidebar" id="sidebar"></aside>
        <div class="backdrop" id="backdrop"></div>

        <div class="main">
            <header class="topbar">
                <button class="menu-btn" id="menuBtn" aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>
                <span class="topbar-title" id="topbarTitle"></span>
                <span class="topbar-user" id="topbarUser"></span>
            </header>

            <main class="page">
                <div class="page-head"><h1>Reviews &amp; Feedback</h1><p>Share your comments about a store or product, and read what other students say.</p></div>

                <div class="tabs" role="tablist">
                    <button class="tab active" data-tab="write" role="tab">Write a review</button>
                    <button class="tab" data-tab="all" role="tab">All reviews</button>
                    <button class="tab" data-tab="mine" role="tab">My reviews <span class="nav-count" id="mineCount">0</span></button>
                </div>

                <section id="paneWrite" class="panel">
                    <form id="reviewForm" novalidate>
                        <div class="form-row">
                            <div>
                                <label class="field-label" for="kind">What are you reviewing?</label>
                                <select class="select block" id="kind"><option value="store">A store</option><option value="product">A product</option></select>
                            </div>
                            <div>
                                <label class="field-label" for="target">Choose one</label>
                                <select class="select block" id="target"></select>
                            </div>
                        </div>
                        <span class="field-label">Type of feedback</span>
                        <div class="chips" id="typeChips">
                            <button type="button" class="chip active" data-type="compliment">Compliment</button>
                            <button type="button" class="chip" data-type="suggestion">Suggestion</button>
                            <button type="button" class="chip" data-type="complaint">Complaint</button>
                        </div>
                        <label class="field-label top-gap" for="text">Your comment</label>
                        <textarea class="input" id="text" maxlength="300" placeholder="What was your experience? What could be better?"></textarea>
                        <div class="form-foot">
                            <span class="muted small" id="counter">0 / 300</span>
                            <span class="form-error" id="formError" role="alert"></span>
                            <button class="btn" type="submit">Post review</button>
                        </div>
                    </form>
                </section>

                <section id="paneAll" hidden>
                    <div class="toolbar">
                        <select class="select" id="filterTarget" aria-label="Filter by store or product"></select>
                        <div class="chips" id="filterType">
                            <button class="chip active" data-ftype="all">All</button>
                            <button class="chip" data-ftype="compliment">Compliments</button>
                            <button class="chip" data-ftype="suggestion">Suggestions</button>
                            <button class="chip" data-ftype="complaint">Complaints</button>
                        </div>
                        <select class="select spacer" id="sortReviews" aria-label="Sort reviews">
                            <option value="new">Newest</option>
                            <option value="helpful">Most helpful</option>
                        </select>
                    </div>
                    <div id="allList"></div>
                </section>

                <section id="paneMine" hidden><div id="mineList"></div></section>
            </main>
        </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- Load order matters: data.js, then shell.js, then this page's script -->
    <script src="../js/data.js"></script>
    <script src="../js/shell.js"></script>
    <script src="../js/reviews.js"></script>
</body>
</html>
