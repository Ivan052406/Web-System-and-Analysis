<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="icon" href="assets/images/casia-logo.png">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/product-ratings.css">
    <title>Product Ratings | CASIA Canteen</title>
</head>
<body data-page="product-ratings" data-title="Product Ratings">

    <div class="app">

        <!-- SIDE NAVIGATION (built by assets/js/shell.js) -->
        <aside class="sidebar" id="sidebar"></aside>
        <div class="backdrop" id="backdrop"></div>

        <div class="main">
            <header class="topbar">
                <button class="menu-btn" id="menuBtn" aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>
                <span class="topbar-title" id="topbarTitle"></span>
                <span class="topbar-user" id="topbarUser"></span>
            </header>

            <main class="page">
                <div class="page-head"><h1>Product Ratings</h1><p>Tap the stars on any product you have tried. Add details if you like.</p></div>
                <div class="mini-stats" id="mine"></div>

                <div class="toolbar">
                    <input class="input search" id="q" type="search" placeholder="Search products" aria-label="Search products">
                    <div class="chips" id="catChips"></div>
                    <label class="check"><input type="checkbox" id="unrated"> Not rated yet</label>
                    <select class="select" id="sort" aria-label="Sort products">
                        <option value="rating">Top rated</option>
                        <option value="name">Name A–Z</option>
                        <option value="store">By store</option>
                    </select>
                </div>

                <section class="grid" id="results"></section>
            </main>
        </div>
    </div>

    <!-- Rating details: written experience tags and the star split -->
    <dialog id="detailDialog"></dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- Load order matters: data.js, then shell.js, then this page's script -->
    <script src="assets/js/data.js"></script>
    <script src="assets/js/shell.js"></script>
    <script src="assets/js/product-ratings.js"></script>
</body>
</html>
