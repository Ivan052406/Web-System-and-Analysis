<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="icon" href="assets/images/casia-logo.png">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/search-store.css">
    <title>Search Store | CASIA Canteen</title>
</head>
<body data-page="search-store" data-title="Search Store">

    <div class="app">

        <!-- SIDE NAVIGATION (built by assets/js/shell.js) -->
        <aside class="sidebar" id="sidebar"></aside>
        <div class="backdrop" id="backdrop"></div>

        <div class="main">
            <header class="topbar">
                <button class="menu-btn" id="menuBtn" aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>
                <span class="topbar-title" id="topbarTitle"></span>
                <span class="topbar-user" id="topbarUser"></span>
            </header>

            <main class="page">
                <div class="page-head"><h1>Search Store</h1><p>Find a store by its name, where it is, or something it sells.</p></div>

                <div class="search-hero">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input id="q" class="input" type="search" placeholder="Try “coffee”, “library”, or a store name" autocomplete="off">
                    <button class="clear" id="clear" aria-label="Clear search" hidden>&times;</button>
                    <ul class="suggest" id="suggest" role="listbox" hidden></ul>
                </div>
                    <div class="recent" id="recent" hidden>
                        <span class="muted small">Recent searches</span>
                        <div class="chips" id="recentChips"></div>
                        <button class="btn link small" id="clearRecent">Clear</button>
                    </div>
                </div>

                <div class="toolbar">
                    <label class="check"><input type="checkbox" id="openOnly"> Open now only</label>
                    <select class="select" id="area" aria-label="Filter by area"></select>
                    <span class="spacer muted small" id="count"></span>
                    <select class="select" id="sort" aria-label="Sort stores">
                        <option value="relevance">Best match</option>
                        <option value="rating">Top rated</option>
                        <option value="name">Name A–Z</option>
                    </select>
                </div>

                <section class="grid" id="results"></section>
            </main>
        </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- Load order matters: data.js, then shell.js, then this page's script -->
    <script src="assets/js/data.js"></script>
    <script src="assets/js/shell.js"></script>
    <script src="assets/js/search-store.js"></script>
</body>
</html>
